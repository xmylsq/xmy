<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!--<meta http-equiv="refresh" content="0; url=3.html">-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>xmy个人网站</title>

    <!-- SEO 基础 -->
    <meta name="description" content="xmy网站" />
    <meta name="author" content="xmy" />

    <!-- 图标 -->
    <link rel="icon" href="1.ico"  />
    

    <!-- 内联 -->
    <style>
        /* 基础重置  全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #cbeb81;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: #86b7f0;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p {
            margin-bottom: 1rem;
            color: #444;
        }

        .meta-info {
            font-size: 0.875rem;
            color: #0d5674;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .container {
                padding: 1.25rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
      <center>  <h1>xmy个人网站</h1>
        <p>这是我的个人网站</p></center>
        <ul style="margin-left: 1.5rem; margin-bottom: 1rem; color: #333;">
            <li><a href="1.html">个人简介</a> </li>
            <li><a href="2.html">文件下载</a></li>
        
        </ul>
        <p style="margin-bottom: 0.5rem;">
            <!--可  写-->
        </p>
        <div class="meta-info">
            <span> 当前时间：<span id="current-time"></span></span>
            &nbsp;·&nbsp;
            
        </div>
    </div>

    <script>
        // 显示当前时间
        (function() {
            const timeEl = document.getElementById('current-time');
            if (timeEl) {
                const now = new Date();
                const formatted = now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + ' ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0');
                timeEl.textContent = formatted;
            }
        })();
    </script>
</body>
</html>
